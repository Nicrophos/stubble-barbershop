<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — STUBBLE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  <header class="header"><a href="index.html" class="logo">STUBBLE<span>BARBERSHOP</span></a></header>
  <main class="account-layout reset-layout">
    <section class="account-card">
      <p class="section-label">ЛИЧНЫЙ КАБИНЕТ</p>
      <h1>НОВЫЙ ПАРОЛЬ</h1>
      <p id="reset-status" class="account-feedback" role="status" aria-live="polite"></p>
      <form id="reset-form" class="account-form">
        <label>Новый пароль (от 8 символов)<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
        <label>Повтори пароль<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>
        <button class="account-button" type="submit">СОХРАНИТЬ ПАРОЛЬ</button>
      </form>
      <a href="/?auth=login" id="reset-home" hidden>Вернуться ко входу</a>
    </section>
  </main>
  <script src="js/reset-password.js" defer></script>
</body>
</html>
